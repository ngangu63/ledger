services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger-postgres
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      # Override via a .env file or the environment; falls back to a dev default.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger}
    ports:
      - "5432:5432"
    volumes:
      - ledger-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ledger-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledger
      DB_USER: ledger
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ledger}
      SERVER_PORT: "8080"
      # Base64-encoded 256-bit JWT secret. Override in production; the fallback is
      # a public dev-only default (see .env.example).
      LEDGER_JWT_SECRET: ${LEDGER_JWT_SECRET:-c2VjdXJlLWRldi1zZWNyZXQtY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMTIzNDU2}
    ports:
      # Host 8081 -> container 8080 (avoids clash with a locally-run backend on 8080)
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ledger-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Optional DB admin UI: `docker compose --profile tools up`
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ledger-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ledger.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  ledger-pgdata:
