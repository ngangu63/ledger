name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The ubuntu-latest runner ships a working Docker daemon, so the
      # Testcontainers integration tests (*IT) run for real during `verify`.
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify
