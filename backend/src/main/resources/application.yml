spring:
  application:
    name: ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Serializable-safe posting relies on short, contended write transactions.
      maximum-pool-size: 20
      pool-name: ledger-pool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

ledger:
  security:
    jwt:
      # Base64-encoded 256-bit secret. Override in production via LEDGER_JWT_SECRET.
      secret: ${LEDGER_JWT_SECRET:c2VjdXJlLWRldi1zZWNyZXQtY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMTIzNDU2}
      # Token time-to-live in seconds (default 1 hour).
      ttl-seconds: ${LEDGER_JWT_TTL:3600}
      issuer: ledger

info:
  app:
    name: Ledger
    description: Financial ledger and payment infrastructure
    version: 0.1.0
